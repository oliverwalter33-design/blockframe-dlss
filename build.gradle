def nativeRuntimeDir = layout.projectDirectory.dir('src/main/resources/assets/nvidia_dlss/native/win-x64')
def nativeExtractFiles = [
    'NvLowLatencyVk.dll',
    'nvidia_dlss_bridge.dll',
    'nis.license.txt',
    'nvngx_dlss.dll',
    'nvngx_dlss.license.txt',
    'reflex.license.txt',
    'sl.common.dll',
    'sl.dlss.dll',
    'sl.interposer.dll',
    'sl.nis.dll'
]
def nativeRuntimeFiles = nativeExtractFiles + [
    'motion_vectors.comp.spv',
    'motion_vectors.debug.comp.spv'
]
def nativeSourceStamp = nativeRuntimeDir.file('native-source-v1.properties')
def nativeBridgeSource = layout.projectDirectory.file('native/nvidia_dlss_bridge.cpp')
def nativeMotionShaderSource = layout.projectDirectory.file('native/shaders/motion_vectors.comp')
def generatedNativeManifestDir = layout.buildDirectory.dir(
    'generated/resources/nativeRuntimeManifest'
)

def generateNativeRuntimeManifest = tasks.register('generateNativeRuntimeManifest') {
    group = 'build'
    description = 'Generates strict canonical manifest/key resources for immutable native artifacts.'
    inputs.files(nativeExtractFiles.collect { nativeRuntimeDir.file(it) })
    inputs.properties(
        minecraftVersion: minecraft_version,
        neoForgeVersion: neo_version,
        blockframeVersion: mod_version
    )
    outputs.files(
        generatedNativeManifestDir.map {
            [
                it.file('META-INF/blockframe/native-runtime-v1.manifest'),
                it.file('META-INF/blockframe/native-runtime-v1.key')
            ]
        }
    )

    doLast {
        def missing = nativeExtractFiles.findAll {
            !nativeRuntimeDir.file(it).asFile.isFile()
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Missing immutable native artifacts: ${missing.join(', ')}"
            )
        }

        def sha256 = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            java.util.HexFormat.of().formatHex(digest.digest())
        }
        def fileLines = nativeExtractFiles
            .sort()
            .collect { name ->
                def file = nativeRuntimeDir.file(name).asFile
                "file=${name}\t${file.length()}\t${sha256(file)}\n"
            }
        def bundleDigest = java.security.MessageDigest.getInstance('SHA-256')
        fileLines.each {
            bundleDigest.update(it.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        }
        def bundleSha256 = java.util.HexFormat.of().formatHex(
            bundleDigest.digest()
        )
        def manifest =
            'BLOCKFRAME_IMMUTABLE_ARTIFACTS_V1\n' +
            'schema=1\n' +
            'artifact=native-runtime\n' +
            "count=${fileLines.size()}\n" +
            fileLines.join('') +
            'bundle=' +
            bundleSha256 +
            '\n'
        def dimensions = [
            'artifact-bundle-sha256': bundleSha256,
            'backend': 'vulkan',
            'blockframe-version': mod_version.toString(),
            'driver-version': 'not-a-dependency-runtime-validated',
            'gpu-device-id': 'not-a-dependency-runtime-validated',
            'gpu-vendor': 'not-a-dependency-runtime-validated',
            'minecraft-api-target': minecraft_version.toString(),
            'minecraft-runtime-version': 'not-a-dependency-of-packaged-native-bundle',
            'mod-list': 'not-a-dependency-of-packaged-native-bundle',
            'neoforge-api-target': neo_version.toString(),
            'neoforge-runtime-version': 'not-a-dependency-of-packaged-native-bundle',
            'registry-state': 'not-a-dependency-of-packaged-native-bundle',
            'resourcepacks': 'not-a-dependency-of-packaged-native-bundle',
            'shaderpack': 'not-a-dependency-of-packaged-native-bundle',
            'vulkan-features': 'not-a-dependency-runtime-negotiated',
            'vulkan-version': 'not-a-dependency-runtime-negotiated',
            'windows-architecture': 'x86_64'
        ]
        def dimensionLines = dimensions
            .sort { left, right -> left.key <=> right.key }
            .collect { name, value -> "dimension=${name}\t${value}\n" }
        def key =
            'BLOCKFRAME_CACHE_KEY_V1\n' +
            'schema=1\n' +
            'kind=native-runtime/windows-x86_64\n' +
            "count=${dimensionLines.size()}\n" +
            dimensionLines.join('')
        def generatedRoot = generatedNativeManifestDir.get()
        def manifestTarget = generatedRoot
            .file('META-INF/blockframe/native-runtime-v1.manifest')
            .asFile
        def keyTarget = generatedRoot
            .file('META-INF/blockframe/native-runtime-v1.key')
            .asFile
        manifestTarget.parentFile.mkdirs()
        manifestTarget.setText(manifest, 'UTF-8')
        keyTarget.setText(key, 'UTF-8')
    }
}

sourceSets.main.resources.srcDir generatedNativeManifestDir
neoForge.ideSyncTask generateNativeRuntimeManifest

tasks.named('processResources', ProcessResources).configure {
    dependsOn generateNativeRuntimeManifest
}

tasks.register('verifyNativeRuntime') {
    group = 'verification'
    description = 'Checks that all native files required by a distributable JAR are staged.'
    dependsOn generateNativeRuntimeManifest
    inputs.files(nativeRuntimeFiles.collect { nativeRuntimeDir.file(it) })
    inputs.files(nativeSourceStamp, nativeBridgeSource, nativeMotionShaderSource)

    doLast {
        def missing = nativeRuntimeFiles.findAll { !nativeRuntimeDir.file(it).asFile.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Missing native runtime files: ${missing.join(', ')}. " +
                'See README.md and run scripts/stage-nvidia-runtime.ps1 plus native/build-native.ps1.'
            )
        }

        if (!nativeSourceStamp.asFile.isFile()) {
            throw new GradleException(
                'Missing native source provenance stamp. Run native/build-native.ps1 before packaging.'
            )
        }
        def sha256 = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            java.util.HexFormat.of().formatHex(digest.digest())
        }
        def stamp = new Properties()
        nativeSourceStamp.asFile.withInputStream { stamp.load(it) }
        def expected = [
            bridgeSourceSha256: sha256(nativeBridgeSource.asFile),
            motionShaderSourceSha256: sha256(nativeMotionShaderSource.asFile),
            bridgeBinarySha256: sha256(nativeRuntimeDir.file('nvidia_dlss_bridge.dll').asFile),
            motionShaderBinarySha256: sha256(nativeRuntimeDir.file('motion_vectors.comp.spv').asFile),
            motionShaderDiagnosticBinarySha256: sha256(nativeRuntimeDir.file('motion_vectors.debug.comp.spv').asFile),
            motionShaderReleaseDefine: 'BLOCKFRAME_DEVELOPER_DIAGNOSTICS=0',
            motionShaderDiagnosticDefine: 'BLOCKFRAME_DEVELOPER_DIAGNOSTICS=1'
        ]
        def mismatches = expected.findAll { name, value ->
            !value.equalsIgnoreCase(stamp.getProperty(name, ''))
        }
        def missingMetadata = [
            'bridgeCompiler',
            'motionShaderCompiler'
        ].findAll { stamp.getProperty(it, '').isBlank() }
        if (
            stamp.getProperty('schema') != '1'
                || !mismatches.isEmpty()
                || !missingMetadata.isEmpty()
        ) {
            throw new GradleException(
                'Native source/binary provenance is stale for: ' +
                (mismatches.keySet() + missingMetadata).join(', ') +
                '. Run native/build-native.ps1 before packaging.'
            )
        }
    }
}

tasks.named('jar', Jar).configure {
    dependsOn tasks.named('verifyNativeRuntime')
    manifest { attributes 'MixinConfigs': 'nvidia_dlss.mixins.json' }
