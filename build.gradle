plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_artifact_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven {
        name = 'CaffeineMC'
        url = 'https://maven.caffeinemc.net/releases'
    }
}

def foundationBVulkanSmoke = providers.systemProperty(
    'blockframe.foundationBVulkanSmokeRun'
).map { it.toBoolean() }.getOrElse(false)

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        vulkanClient {
            client()
            gameDirectory = project.file('run-vulkan')
            programArguments.addAll '--graphicsBackend', 'vulkan'
            [
                'devSequenceFrames',
                'devSequenceStartFrame',
                'devSequenceRoi',
                'devSequenceId',
                'devForceThirdPerson',
                'devSequenceMotion',
                'devLocalPlayerMotion'
            ].each { diagnosticProperty ->
                providers.gradleProperty(diagnosticProperty).orNull?.with {
                    systemProperty "nvidia_dlss.${diagnosticProperty}", it
                }
            }
            if (providers.gradleProperty('devWidth').isPresent()) {
                programArguments.addAll '--width', providers.gradleProperty('devWidth').get()
            }
            if (providers.gradleProperty('devHeight').isPresent()) {
                programArguments.addAll '--height', providers.gradleProperty('devHeight').get()
            }
            if (!foundationBVulkanSmoke) {
                programArguments.addAll '--quickPlaySingleplayer',
                    providers.gradleProperty('devWorld').getOrElse('Neue Welt')
            } else {
                systemProperty(
                    'blockframe.nativeTerrain.foundationBSmoke',
                    'true'
                )
            }
            systemProperty 'nvidia_dlss.selftest', 'true'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

def prepareVulkanRunConfig = tasks.register('prepareVulkanRunConfig', Copy) {
    group = 'blockframe'
    description = 'Disables NeoForge early OpenGL window takeover for the dedicated Vulkan development run.'
    from layout.projectDirectory.file('run-config/vulkan/fml.toml')
    into layout.projectDirectory.dir('run-vulkan/config')
}

tasks.named('runVulkanClient').configure {
    dependsOn prepareVulkanRunConfig
}

dependencies {
    compileOnly "net.caffeinemc:sodium-neoforge-api:${sodium_version}"
    // Exact, compile-time-only API evidence for the fail-closed Bricks 1.0.1
    // compatibility path. The artifact boundary test forbids packaging it.
    compileOnly files(project.bricks_compat_evidence_jar)
    testImplementation files(project.bricks_compat_evidence_jar)
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.joml:joml:1.10.8'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        // Phase 1A.11 verifies Mojang's VulkanFeature/pNext contract against
        // the same patched Minecraft and LWJGL classes used by production.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    phase1a8Benchmark {
        java.srcDir 'src/benchmark/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    phase1a10Benchmark {
        java.srcDir 'src/phase1a10Benchmark/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    phase1a12Benchmark {
        java.srcDir 'src/phase1a12Benchmark/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    phase2a0bHarness {
        java.srcDir 'src/phase2a0bHarness/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    phase2a0bTest {
        java.srcDir 'src/phase2a0bTest/java'
        compileClasspath += (
            sourceSets.phase2a0bHarness.output
            + sourceSets.phase2a0bHarness.compileClasspath
            + sourceSets.test.compileClasspath
        )
        runtimeClasspath += (
            output
            + compileClasspath
            + sourceSets.phase2a0bHarness.runtimeClasspath
            + sourceSets.test.runtimeClasspath
        )
    }
    phase2a0cCapture {
        java.srcDir 'src/phase2a0cCapture/java'
        // Consume only the patched Minecraft/NeoForge dependency graph. The
        // standalone capture artifact must never see BlockFrame main output.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    phase2a0cTest {
        java.srcDir 'src/phase2a0cTest/java'
        compileClasspath += (
            sourceSets.phase2a0cCapture.output
            + sourceSets.phase2a0cCapture.compileClasspath
            + configurations.testCompileClasspath
        )
        runtimeClasspath += (
            output
            + compileClasspath
            + sourceSets.phase2a0cCapture.runtimeClasspath
            + configurations.testRuntimeClasspath
