    }
    phase2a1CaptureV2 {
        java.srcDir 'src/phase2a1CaptureV2/java'
        // V2 remains an isolated development capture artifact. It consumes
        // Mojang/NeoForge/LWJGL only and never sees BlockFrame main output.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    phase2a1TestV2 {
        java.srcDir 'src/phase2a1TestV2/java'
        compileClasspath += (
            sourceSets.phase2a1CaptureV2.output
            + sourceSets.phase2a1CaptureV2.compileClasspath
            + configurations.testCompileClasspath
        )
        runtimeClasspath += (
            output
            + compileClasspath
            + sourceSets.phase2a1CaptureV2.runtimeClasspath
            + configurations.testRuntimeClasspath
        )
    }
    phase2a1CaptureV6 {
        java.srcDir 'src/phase2a1CaptureV6/java'
        // V6 is the isolated deterministic-workload audit capture. It sees
        // Mojang/NeoForge/LWJGL only and never BlockFrame production output.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    phase2a1TestV6 {
        java.srcDir 'src/phase2a1TestV6/java'
        compileClasspath += (
            sourceSets.phase2a1CaptureV6.output
            + sourceSets.phase2a1CaptureV6.compileClasspath
            + configurations.testCompileClasspath
        )
        runtimeClasspath += (
            output
            + compileClasspath
            + sourceSets.phase2a1CaptureV6.runtimeClasspath
            + configurations.testRuntimeClasspath
        )
    }
    phase2a1CaptureV7 {
        java.srcDir 'src/phase2a1CaptureV7/java'
        // V7 is the isolated canonical-visible-workload audit capture. It
        // consumes Mojang/NeoForge/LWJGL only and never BlockFrame output.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    phase2a1TestV7 {
        java.srcDir 'src/phase2a1TestV7/java'
        compileClasspath += (
            sourceSets.phase2a1CaptureV7.output
            + sourceSets.phase2a1CaptureV7.compileClasspath
            + configurations.testCompileClasspath
        )
        runtimeClasspath += (
            output
            + compileClasspath
