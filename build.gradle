tasks.register('phase2a0bHarnessJar', Jar) {
    group = 'blockframe benchmark'
    description = 'Builds the dev-only Phase 2A.0B Minecraft scout/replay harness; never published.'
    dependsOn tasks.named('phase2a0bHarnessClasses')
    archiveClassifier = 'phase2a0b-harness-dev-only'
    from sourceSets.phase2a0bHarness.output
    manifest {
        attributes(
            'MixinConfigs': 'blockframe_phase2a0b.mixins.json',
            'BlockFrame-Dev-Only': 'true'
        )
    }
}

tasks.register('phase2a0bFixtureRunner', JavaExec) {
    group = 'blockframe benchmark'
    description = 'Prepares or finalizes one physical Phase 2A.0B fixture run copy.'
    dependsOn tasks.named('phase2a0bHarnessClasses')
    classpath = sourceSets.phase2a0bHarness.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    mainClass = 'de.morau.blockframe.benchmark.phase2a0b.FixtureRunManager'
    doFirst {
        def command = project.findProperty('phase2a0bCommand')
        def instance = project.findProperty('phase2a0bInstance')
        if (command == null || instance == null) {
            throw new GradleException(
                'phase2a0bFixtureRunner requires '
                    + '-Pphase2a0bCommand=<create-config-profile|prepare-scout|prepare-replay|prepare-suite|verify-start-profile|finalize|finalize-suite|restore-config|raw-config-hash|audit|topology|offline-audit> '
                    + 'and -Pphase2a0bInstance=<CurseForge instance>'
            )
        }
        args command, instance, project.projectDir.absolutePath
        if (project.hasProperty('phase2a0bRunId')) {
            args project.property('phase2a0bRunId')
        }
        if (project.hasProperty('phase2a0bSceneId')) {
            args project.property('phase2a0bSceneId')
        }
    }
}

tasks.register('verifyPhase2a0bProductionJar') {
    group = 'verification'
    description = 'Proves Phase 2A.0B harness and CPU sampler classes are absent from the production JAR.'
    dependsOn tasks.named('jar')
    doLast {
        def forbiddenPrefix =
            'de/morau/blockframe/benchmark/phase2a0b/'
        def leaked = zipTree(tasks.named('jar').get().archiveFile.get().asFile)
            .matching { include "${forbiddenPrefix}**" }
            .files
        if (!leaked.isEmpty()) {
            throw new GradleException(
                "Phase 2A.0B dev classes leaked into production JAR: ${leaked}"
            )
        }
    }
}

