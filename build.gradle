tasks.register('sourceZip', Zip) {
    group = 'build'
    description = 'Assembles the redistributable source archive with deterministic metadata and ordering.'
    archiveClassifier = 'sources'
    archiveExtension = 'zip'
    destinationDirectory = layout.buildDirectory.dir('libs')
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    from(layout.projectDirectory) {
        include 'build.gradle'
        include 'CHANGELOG.md'
        include 'CHANGELOG-DE.md'
        include 'CHANGELOG-EN.md'
        include 'gradle/**'
        include 'gradle.properties'
        include 'gradlew'
        include 'gradlew.bat'
        include 'LICENSE'
        include 'NATIVE_TERRAIN_ARCHITECTURE.md'
        include 'native/**'
        include 'README.md'
        include 'RELEASE-VERIFICATION-DE.md'
        include 'settings.gradle'
        include 'src/**'
        include 'benchmarks/fixtures/blockframe-benchmark-config-v1.json'
        include 'benchmarks/fixtures/blockframe-2a0b-captured-runtime-v2.json'
        include 'benchmarks/fixtures/blockframe-dtc-scenes-v1.json'
        include 'benchmarks/fixtures/blockframe-dtc-scenes-v2.json'

        // Keep the source bundle source-only and preserve the previous archive scope.
        exclude '**/*.dll'
        exclude '**/*.jar'
        exclude '**/*.lib'
        exclude '**/*.pdb'
        exclude '**/*.spv'
    }
}
