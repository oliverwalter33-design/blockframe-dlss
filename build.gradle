tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'blockframe.projectDir', project.projectDir.absolutePath
    systemProperty(
        'blockframe.bricksCompatEvidenceJar',
        project.bricks_compat_evidence_jar
    )
    systemProperty(
        'blockframe.minecraft26057PatchedEvidenceJar',
        project.minecraft_26_2_0_57_patched_evidence_jar
    )
    def junitTempRoot = layout.buildDirectory.dir(
        "tmp/junit/${name}"
    )
    systemProperty(
        'java.io.tmpdir',
        junitTempRoot.get().asFile.absolutePath
    )
    systemProperty(
        'junit.jupiter.tempdir.cleanup.mode.default',
        'NEVER'
    )
    doFirst {
        def root = junitTempRoot.get().asFile
        if (root.exists()) {
            project.delete(root)
        }
        if (!root.mkdirs() && !root.isDirectory()) {
            throw new GradleException(
                "Could not create isolated JUnit temp root: ${root}"
            )
        }
    }
    doLast {
        def root = junitTempRoot.get().asFile
        for (int attempt = 0;
            root.exists() && attempt < 10;
            attempt++) {
            try {
                project.delete(root)
            } catch (Exception ignored) {
                // A Windows scanner may briefly retain a new test file.
            }
            if (root.exists()) {
                Thread.sleep(50L)
            }
        }
        if (root.exists()) {
            throw new GradleException(
                "Isolated JUnit temp root remained: ${root}"
            )
        }
    }
}

tasks.named('test', Test) {
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
        .withPropertyName('blockframeDistributableJar')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    doFirst {
        systemProperty(
            'blockframe.distributableJar',
            tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
        )
    }
}

