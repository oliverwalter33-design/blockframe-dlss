name: Native binary reproducibility

on:
  push:
    paths:
      - '.github/workflows/native-reproducibility.yml'
      - 'native/**'
      - 'provenance/0.3.16/**'
      - 'scripts/stage-nvidia-runtime.ps1'
      - 'scripts/verify-native-provenance.ps1'
      - 'scripts/verify-published-native-rebuild.ps1'
      - 'src/main/resources/assets/nvidia_dlss/native/win-x64/native-source-v1.properties'
  pull_request:
    paths:
      - '.github/workflows/native-reproducibility.yml'
      - 'native/**'
      - 'provenance/0.3.16/**'
      - 'scripts/stage-nvidia-runtime.ps1'
      - 'scripts/verify-native-provenance.ps1'
      - 'scripts/verify-published-native-rebuild.ps1'
      - 'src/main/resources/assets/nvidia_dlss/native/win-x64/native-source-v1.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-published-native-binaries:
    name: Verify Modrinth JARs and rebuild native outputs
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up exact JDK used by the native build
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '25.0.3+9'
          architecture: x64
          check-latest: false

      - name: Download, rebuild, and verify every published native file
        shell: pwsh
        run: ./scripts/verify-published-native-rebuild.ps1
